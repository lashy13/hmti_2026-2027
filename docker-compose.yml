services:
  mysql:
    image: mysql:8.0
    container_name: hmti-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hmti_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: hmti-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: hmti_db
      DB_PORT: 3306
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  mysql_data: